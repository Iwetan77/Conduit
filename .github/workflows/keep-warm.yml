# Keeps the Render free-tier API awake.
#
# Render free instances spin down after ~15 minutes idle, and the next request
# eats a ~50s cold start. Since the browser now routes ALL Arc RPC through this
# service (the /v1/rpc proxy, which shares the process with the API), a cold
# instance makes every payment fail with a "Load failed" timeout. Pinging
# /healthz every ~10 minutes keeps it warm so the proxy is always responsive.
#
# Note: GitHub's scheduled runs can be delayed several minutes under load, so
# this is a best-effort baseline, not a hard SLA. For punctual warming, also
# run a cron-job.org monitor hitting the same URL every 10 minutes.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" https://conduit-z56x.onrender.com/healthz || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "healthz did not return 200 after retries" >&2
          exit 1
