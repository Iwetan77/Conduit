[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

[etherscan]
arc_testnet = { key = "placeholder", url = "https://testnet.arcscan.app/api" }

[fuzz]
runs = 256

# Relative to this project root (packages/contracts), so the deploy works on
# any machine and in CI. It was an absolute path under one developer's home
# directory, which no other checkout could satisfy.
[[profile.default.fs_permissions]]
access = "read-write"
path = "../../deployments"
