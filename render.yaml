# Render Blueprint for the Conduit settlement API.
#
# Postgres is NOT declared here on purpose: Render's free Postgres expires
# and is deleted after 30 days. Use Neon's free tier instead (no expiry) and
# paste its connection string into DATABASE_URL below.
#
# The app (Next.js) deploys to Vercel separately — see DEPLOY.md.
services:
  - type: web
    name: conduit-api
    runtime: docker
    plan: free
    # Build only the Go module, not the whole monorepo.
    dockerfilePath: ./packages/api/Dockerfile
    dockerContext: ./packages/api
    healthCheckPath: /healthz
    envVars:
      # ── Required ──────────────────────────────────────────────────────
      # Neon connection string. Must include ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Circle StableFX sandbox key.
      - key: STABLEFX_API_KEY
        sync: false

      # ── Strongly recommended ──────────────────────────────────────────
      # CORS allowlist -- the app's origin, e.g. https://useconduit.xyz
      # Required for the browser app to reach this API. Unset, no cross-origin
      # headers are served at all and browser calls are refused; it no longer
      # falls back to a wildcard, so a forgotten value fails visibly here
      # instead of silently opening the API to every site.
      - key: CONDUIT_ALLOWED_ORIGINS
        sync: false
      # Public app origin, used to build hosted_url on payment links. Get
      # this wrong and every generated link/QR points at the wrong host.
      #
      # Pinned here rather than left to the dashboard, because it HAD drifted:
      # every link and QR generated in production carried the deploy-preview
      # host (useconduit-app.vercel.app) instead of the real domain. A link is
      # the product -- it gets pasted into WhatsApp and X and outlives whatever
      # host was current the day it was made -- so the value belongs in git
      # where a wrong one shows up in review, not in a console where nothing
      # ever reads it back.
      - key: CONDUIT_APP_BASE_URL
        value: https://useconduit.xyz

      # Conduit's own router on Arc testnet. The settlement indexer watches it
      # for PaymentSettled, so leaving it unset silently disables that path.
      # Not a secret -- it is a public contract address.
      #
      # Repointed in Phase A6. The previous router,
      # 0x80f996e86C003AF309635B67A53dC6e63e623318, is ABANDONED and must never
      # be set here again: it still carries executeWithFX, which is externally
      # callable with no sender check and emits a settlement event for any
      # amount while moving one unit of any token. The indexer verifies
      # transfers now (Phase A2), so a forged event would be dropped rather than
      # believed -- but pointing at that contract would be reintroducing the
      # thing this work removed.
      - key: CONDUIT_ROUTER_ADDRESS
        value: "0x2Bd51BB0CA986703A4449796EdCeCAB81126899C"

      # The batch payroll contract. Also a public address, and also pinned
      # here rather than left to the dashboard -- it was left to the dashboard,
      # nobody filled it in, and every payroll run answered "not configured".
      # The API now carries this same address as a built-in default, so this
      # entry is the override rather than the only copy.
      - key: CONDUIT_PAYROLL_ADDRESS
        value: "0xcC4b99a2B74DA98695d4136FB7F20988621BeB11"

      # ── Merchant login: Circle Wallets ─────────────────────────────────
      # The API key is a server-side secret and never reaches the browser;
      # the app calls /v1/auth/circle/* to mint device and user tokens.
      # Optional in the same way PRIVY_APP_ID / PRIVY_VERIFICATION_KEY were
      # before Phase 7 removed them: without it those routes report
      # "not configured" and only sk_/pk_ key auth works.
      - key: CIRCLE_API_KEY
        sync: false

      # Signs dashboard session tokens. Without it the API mints a random
      # secret per boot, so every deploy signs every merchant out.
      - key: CONDUIT_SESSION_SECRET
        generateValue: true

      # Render terminates TLS in front of the service, so the client IP arrives
      # in X-Forwarded-For. Rate limiting needs this to tell callers apart
      # rather than seeing every request as coming from the proxy.
      - key: CONDUIT_TRUSTED_PROXY
        value: "1"

      # ── Optional: cross-chain funding ──────────────────────────────────
      # This wallet BROADCASTS transactions -- it pays the merchant out of its
      # own USDC once a bridged transfer mints. It needs both a USDC float and
      # gas, and it runs dry silently. The comment here used to read "signs
      # only, holds no gas", which would size it at zero.
      - key: ARC_RELAYER_KEY
        sync: false
